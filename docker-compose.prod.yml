# Patient Flow OS — PRODUCTION stack for a single VPS.
#
# Separate from docker-compose.yml (local demo) — never overrides it.
# Run with an explicit env file so values are read from .env.production:
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Hardening vs local compose:
#   - Postgres + Redis have NO host ports (internal network only).
#   - Only Caddy is published (80/443); the backend is reachable only via Caddy.
#   - Caddy terminates HTTPS with automatic Let's Encrypt certs ({$DOMAIN}).
#   - restart: always on every service; backend waits for healthy deps.
#   - Redis requires a password; Postgres password comes from the env file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pfos_postgres
    restart: always
    environment:
      POSTGRES_USER: pfos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: patient_flow_os
    volumes:
      - pfos_pgdata:/var/lib/postgresql/data
      # Write-ahead log archive. Kept on its OWN volume so a base backup and its
      # WAL segments are not lost together, and so archiving cannot fill the
      # data directory. basebackup.sh prunes it.
      - pfos_wal_archive:/wal_archive
    # Continuous WAL archiving turns a nightly dump (RPO up to 24 hours) into
    # point-in-time recovery (RPO ~ the last archived segment). The archive
    # command is deliberately conservative: it refuses to overwrite an existing
    # segment, because silently replacing one breaks the replay chain in a way
    # that is only discovered during a restore.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
    networks:
      - internal
    # No `ports:` — Postgres is unreachable from the host/internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfos -d patient_flow_os"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pfos_redis
    restart: always
    environment:
      # Exposed to the container so the healthcheck shell can authenticate.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.production}"]
    volumes:
      - pfos_redisdata:/data
    networks:
      - internal
    # No `ports:` — Redis is unreachable from the host/internet.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: .
    container_name: pfos_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://pfos:${POSTGRES_PASSWORD}@postgres:5432/patient_flow_os?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.production}
      OTP_EXPIRY_SECONDS: ${OTP_EXPIRY_SECONDS:-300}
      # Public origin(s). The desktop apps use tauri.localhost; the patient
      # native app sends no Origin. Add hosted web origins here if any.
      CORS_ORIGINS: "https://${DOMAIN},http://tauri.localhost,https://tauri.localhost"
      # Unset means /metrics is disabled in production, not public. See ops/prometheus/.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Demo seeding is OFF and must stay off. The seed creates staff accounts
      # with documented passwords and deletes live bookings; the backend refuses
      # to start if this is ever set to true under NODE_ENV=production.
      SEED_ON_START: "false"
      # Shared secret for the server-to-server /voice/* API; must match the voice
      # agent's VOICE_INTERNAL_SECRET. Blank leaves /voice/* fail-closed (401),
      # which is the right default until the agent is actually deployed.
      VOICE_INTERNAL_SECRET: ${VOICE_INTERNAL_SECRET:-}
      # External integrations (blank -> dev fallbacks). Provided by .env.production.
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID:-}
      INTEGRATIONS_TEST_MOBILE: ${INTEGRATIONS_TEST_MOBILE:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Mount a service-account JSON at ./secrets and point here, or inline JSON.
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      NOTIFY_APPROACHING_AHEAD: ${NOTIFY_APPROACHING_AHEAD:-3}
      NOTIFY_ARRIVAL_AHEAD: ${NOTIFY_ARRIVAL_AHEAD:-1}
    volumes:
      # Optional: FCM service-account secret, read-only. Safe if the dir is empty.
      - ./secrets:/app/secrets:ro
    networks:
      - internal
    # Reachable only inside the compose network (Caddy proxies to it).
    expose:
      - "3000"
    healthcheck:
      # Readiness, not liveness: /health/ready answers 200 only when Postgres and
      # Redis both respond. The previous check treated ANY HTTP response —
      # including 401 and 404 — as healthy, so a backend whose database
      # connection had died reported healthy while serving 503s to the clinic.
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: pfos_caddy
    restart: always
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pfos_caddy_data:/data   # Let's Encrypt certs + ACME account (persist!)
      - pfos_caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  pfos_pgdata:
  pfos_wal_archive:
  pfos_redisdata:
  pfos_caddy_data:
  pfos_caddy_config:
